plugins {
    id 'com.android.application'
}

// Release signing is optional: without keystore.properties the release APK is left unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'cn.modificator.launcher'
    compileSdk 34

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    defaultConfig {
        applicationId "com.moan.moanwm"
        minSdkVersion 17
        targetSdkVersion 29
        versionCode 35
        versionName "0.2.3"
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    flavorDimensions = ["screen"]
    productFlavors {
        home {
            dimension "screen"
        }
        /*epd {
            dimension "screen"
        }*/
    }
    packaging {
        resources.excludes += [
            'proguard-project.txt',
            'project.properties',
            'META-INF/LICENSE.txt',
            'META-INF/LICENSE',
            'META-INF/NOTICE.txt',
            'META-INF/NOTICE',
            'META-INF/DEPENDENCIES.txt',
            'META-INF/DEPENDENCIES',
            'META-INF/androidx*',
            'META-INF/spring*',
            'META-INF/proguard/*',
        ]
    }
}

dependencies {
    implementation 'androidx.core:core:1.1.0'
    implementation 'org.apache.ftpserver:ftplet-api:1.1.0'
    implementation 'org.apache.ftpserver:ftpserver-core:1.1.0'
    //can't connect http://fw.ydevices.com/maven
//    compileOnly files('src/libs/yotadevice_sdk-3.7.12.jar')
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.code.gson:gson:2.8.6'
}
