plugins {
    id 'com.android.application'
}

// Release signing is optional: without keystore.properties the release APK is left unsigned.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'cn.modificator.launcher'
    compileSdk 34

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    defaultConfig {
        applicationId "com.moan.moanwm"
        minSdkVersion 17
        targetSdkVersion 29
        versionCode 58
        versionName "0.8.8"
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // ./gradlew testHomeDebugUnitTest -Pscreenshots renders app/build/screenshots/*.png
                systemProperty "screenshots", project.hasProperty("screenshots") ? "true" : "false"
            }
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    flavorDimensions = ["screen"]
    productFlavors {
        home {
            dimension "screen"
        }
        /*epd {
            dimension "screen"
        }*/
    }
    packaging {
        resources.excludes += [
            'proguard-project.txt',
            'project.properties',
            'META-INF/LICENSE.txt',
            'META-INF/LICENSE',
            'META-INF/NOTICE.txt',
            'META-INF/NOTICE',
            'META-INF/DEPENDENCIES.txt',
            'META-INF/DEPENDENCIES',
            'META-INF/androidx*',
            'META-INF/spring*',
            'META-INF/proguard/*',
        ]
    }
}

dependencies {
    implementation 'androidx.core:core:1.1.0'
    implementation 'org.apache.ftpserver:ftplet-api:1.1.0'
    implementation 'org.apache.ftpserver:ftpserver-core:1.1.0'
    //can't connect http://fw.ydevices.com/maven
//    compileOnly files('src/libs/yotadevice_sdk-3.7.12.jar')
    // Only FragmentActivity/Fragment are used; appcompat itself is not needed.
    implementation 'androidx.fragment:fragment:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.code.gson:gson:2.8.6'

    // Smoke tests of the launcher lifecycle on the JVM (Robolectric, Android 8.1 like the device)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}

// Keep the R8 mapping of every release build, to decode obfuscated crash reports from the
// device later (app/release/ is gitignored).
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name == 'release') {
        variant.assembleProvider.configure { task ->
            task.doLast {
                copy {
                    from variant.mappingFileProvider
                    into rootProject.file("app/release/mappings")
                    rename { "mapping-${variant.versionName}.txt" }
                }
            }
        }
    }
}

// A hang in the Robolectric tests (e.g. an endless layout loop) fails the build after a while
// instead of blocking it for good. JUnit timeout rules can't be used: Robolectric runs each
// test on its own main thread.
tasks.withType(Test).configureEach {
    timeout = java.time.Duration.ofMinutes(8)
}
